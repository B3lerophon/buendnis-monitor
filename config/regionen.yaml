# Definiert die Regionen, nach denen OSINT-Funde (ISW, Bellingcat, Oryx, RUSI)
# im Dashboard-Reiter "OSINT" gruppiert werden. Rein informativ - beeinflusst
# keine Ampel (siehe zusagen.yaml für die eigentlichen Bündnis-Zusagen).
#
# Klassifizierung: keyword-basiert, wie bei den Zusagen. Ein Fund wird der
# ERSTEN Region zugeordnet, deren Keywords im Text auftauchen (Reihenfolge
# unten = Priorität). Passt nichts, landet der Fund in "sonstige_global".

regionen:
  - id: inland
    name: "Inland"
    keywords:
      - "Deutschland"
      - "Bundeswehr"
      - "Bundestag"
      - "Bundesregierung"
