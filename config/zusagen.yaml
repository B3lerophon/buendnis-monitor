# Definiert die politischen Zusagen/Bündnisverpflichtungen, die das System trackt.
#
# Jede Zusage hat:
#   id                 eindeutiger Schlüssel (wird im Dashboard als URL-Anker genutzt)
#   name               Anzeigename
#   ebene              NATO | EU | Bund
#   beschreibung       kurzer Kontext, damit die Einordnung nachvollziehbar bleibt
#   keywords_kontext    Begriffe, die einen Text überhaupt erst als "betrifft diese Zusage" markieren
#   keywords_positiv    Begriffe, die auf Bestätigung/Einhaltung/Ausweitung hindeuten -> stärkt die Zusage
#   keywords_negativ    Begriffe, die auf Rückzug/Verzögerung/Aufweichung hindeuten -> schwächt die Zusage
#
# Absichtlich breite Listen: das Themenfeld (Verteidigungspolitik, NATO, EU-
# Sicherheitspolitik, Ukraine-Unterstützung) ist riesig und wird in sehr
# unterschiedlicher Sprache verhandelt - amtlich, journalistisch, militärisch-
# fachsprachlich, und auf Englisch (NATO-Quelle liefert englische Texte).
# Enthält deshalb bewusst auch: handelnde Personen/Institutionen, Gremien/
# Formate, konkrete Waffensysteme, Beschaffungs-/Haushaltsfachbegriffe.
#
# Trade-off: mehr Keywords = mehr Treffer, aber auch mehr Grenzfälle, bei
# denen "unklar" (gelb) die ehrlichere Einschätzung ist als eine eindeutige
# Farbe. Das ist gewollt - siehe README zu den Grenzen des regelbasierten
# Ansatzes.
#
# Lebendes Dokument: docs/data/log.jsonl zeigt, welche Formulierungen in
# echten Funden auftauchen und noch fehlen.

